# Elmoorx v4 — Docker Compose للإنتاج
# =====================================
# يتضمّن: app + redis + nginx load balancer + prometheus + grafana

version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────
  # Elmoorx App (3 replicas للـ load balancing)
  # ─────────────────────────────────────────────────────────────
  app:
    build: .
    image: elmoorx-v4:latest
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - RATE_LIMIT_STORE=redis
      - SESSION_STORE=redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - elmoorx-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # Redis (sessions + rate limiting distributed)
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - elmoorx-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # NGINX Load Balancer
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - elmoorx-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # Prometheus (metrics collection)
  # ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - elmoorx-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # Grafana (dashboards)
  # ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - elmoorx-net
    restart: unless-stopped

networks:
  elmoorx-net:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
